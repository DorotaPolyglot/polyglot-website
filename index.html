<script>
window.addEventListener('message', function (event) {
  if (!event.data || event.data.type !== 'polyglot-form-height') return;
  var frames = document.querySelectorAll('iframe.polyglot-form-frame');
  frames.forEach(function (frame) {
    if (frame.contentWindow === event.source && event.data.height) {
      frame.style.height = Math.max(220, Number(event.data.height)) + 'px';
    }
  });
});
</script>

<script>
(function () {
  const NEW_REVIEWS = [{"name":"Marlena Paech","role":"Menedżer, bankowość","initials":"MP","text":"Bardzo polecam lekcje z Dorotą. Jest zawsze świetnie przygotowana i dostosowuje zajęcia do moich potrzeb. Odkąd zaczęłam uczęszczać na lekcje, widzę ogromny postęp w swoim angielskim i z każdych zajęć wynoszę naprawdę dużo. Dodatkowym plusem jest fantastyczna, luźna atmosfera. Zajęcia bardziej przypominają miłe spotkanie niż typową lekcję, dzięki czemu nauka jest przyjemna i całkowicie bezstresowa. Zdecydowanie polecam każdemu, kto chce rozwijać swój angielski w świetnej atmosferze."},{"name":"Maja Piwińska","role":"Specjalista ds. ekonomicznych, branża budowlana","initials":"MP","text":"Jestem bardzo zadowolona z zajęć z języka angielskiego. Pracuję jako specjalista ds. ekonomicznych w korporacji z branży budowlanej i zależało mi na rozwinięciu umiejętności językowych, które wykorzystuję w pracy, ale również umiejętności, które poszerzą moją wiedzę językową oraz pozwolą na swobodne komunikowanie się. Zajęcia są ciekawe, prowadzone w miłej atmosferze i dopasowane do moich potrzeb. Widzę wyraźne postępy i czuję się coraz swobodniej w komunikacji po angielsku, zarówno biznesowo, jak i prywatnie. Zdecydowanie polecam!"},{"name":"Izabela W.","role":"Obsługa klienta niemieckojęzycznego","initials":"IW","text":"Każde zajęcia są starannie i sumiennie przygotowane. Za każdym razem zwiększa się pula nowego słownictwa, pojawiają się ciekawe tematy do dyskusji, pytania, dzięki którym możemy się też lepiej poznać podczas zajęć. Atmosfera jest swobodna i pozytywna, więc jeśli ktokolwiek ma obawy przed mówieniem, zapewniam, że znikają one zaraz po pierwszych zajęciach :-) Z czystym sumieniem polecam. Jest to wartościowa inwestycja w siebie i motywacja do działania, żeby jeszcze lepiej posługiwać się tym językiem. Prowadząca jest cierpliwa i w razie potrzeby wytłumaczy wszystko, co może być nie do końca jasne. Bardzo polecam! 🥰"},{"name":"Dorota G.","role":"Księgowa","initials":"DG","text":"Dorota to świetny motywator do nauki angielskiego, rozpoczynając z nią lekcje pomogła od razu przełamać barierę w mówieniu po angielsku. Na zajęcia jest zawsze świetnie przygotowana, ma gotowe materiały do przeprowadzenia lekcji. Zawsze jest skupiona na uczniu, posiada nieskończone pokłady cierpliwości."},{"name":"Kinga S.","role":"R&D Specialist (branża chemiczna)","initials":"KS","text":"Dorota to niesamowicie cierpliwa i zaangażowana lektorka. Na zajęciach korzystamy z wielu ciekawych i różnorodnych materiałów, które są dobierane w taki sposób, aby odpowiadały moim potrzebom i pomagały mi robić realne postępy. Doceniam szczególnie atmosferę na zajęciach - jest swobodna, bez presji i stresu, dzięki czemu nauka angielskiego stała się dla mnie dużo przyjemniejsza. Serdecznie polecam naukę z Dorotą!"},{"name":"Ula M.","role":"Studentka, zarządzanie i marketing","initials":"UM","text":"Bardzo doceniam Dorotę za jej elastyczność w prowadzeniu zajęć i przygotowywaniu materiałów. Oprócz czytania artykułów, ćwiczenia słownictwa i gramatyki miałyśmy wiele lekcji, które przegadywałyśmy po prostu na różne tematy np. o tym, co ostatnio się u nas wydarzyło albo o podróżach. To były świetne okazje do ćwiczenia mówienia. Dorota przygotowała mnie również do egzaminu na studiach - zarówno z części pisemnej, jak i ustnej, gdzie ważna była znajomość zwrotów biznesowych. Egzamin zdałam wyśmienicie! Dorota dba o swobodną atmosferę, jest wyrozumiała i cierpliwa, dzięki czemu na zajęciach można czuć się naprawdę komfortowo. Bardzo polecam!"}];

  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  function makeCard(review) {
    const article = document.createElement('article');
    article.className = 'polyglot-review-card';

    const p = document.createElement('p');
    p.textContent = review.text;

    const footer = document.createElement('footer');

    const initials = document.createElement('span');
    initials.className = 'initials';
    initials.textContent = review.initials;

    const meta = document.createElement('div');
    const strong = document.createElement('strong');
    strong.textContent = review.name;
    const small = document.createElement('small');
    small.textContent = review.role;

    meta.append(strong, small);
    footer.append(initials, meta);
    article.append(p, footer);
    return article;
  }

  async function captureGreta(section, originalGrid, originalControls) {
    const findGreta = () => Array.from(originalGrid.querySelectorAll('.testimonial-card'))
      .find(card => {
        const signature = card.querySelector('strong')?.textContent.trim();
        return signature === 'G.S.';
      });

    let card = findGreta();
    if (card) return card.cloneNode(true);

    const buttons = originalControls ? Array.from(originalControls.querySelectorAll('button')) : [];
    const next = buttons.length ? buttons[buttons.length - 1] : null;
    if (!next) return null;

    const seen = new Set();

    for (let i = 0; i < 12; i++) {
      const signature = (originalGrid.innerText || '').trim();
      if (seen.has(signature)) break;
      seen.add(signature);

      next.click();
      await wait(180);

      card = findGreta();
      if (card) return card.cloneNode(true);
    }

    return null;
  }

  function normalizeGretaCard(oldCard) {
    const article = document.createElement('article');
    article.className = 'polyglot-review-card';

    const oldP = oldCard.querySelector('p');
    const oldFooter = oldCard.querySelector('footer');

    if (oldP) {
      const p = document.createElement('p');
      p.textContent = oldP.textContent.trim();
      article.appendChild(p);
    }

    if (oldFooter) {
      article.appendChild(oldFooter.cloneNode(true));
    }

    return article;
  }

  async function buildReviews() {
    const section = document.querySelector('.testimonials');
    if (!section) return false;
    if (section.dataset.polyglotFinal === '1') return true;

    const originalGrid = section.querySelector('.testimonial-grid');
    if (!originalGrid) return false;

    const originalControls = section.querySelector('.slider-controls');
    const gretaOld = await captureGreta(section, originalGrid, originalControls);

    if (!gretaOld) {
      console.warn('Polyglot: nie udało się znaleźć opinii Grety.');
      return false;
    }

    section.dataset.polyglotFinal = '1';

    const grid = document.createElement('div');
    grid.className = 'polyglot-reviews-grid';

    NEW_REVIEWS.forEach(review => grid.appendChild(makeCard(review)));
    grid.appendChild(normalizeGretaCard(gretaOld));

    const controls = document.createElement('div');
    controls.className = 'polyglot-review-controls';

    const prev = document.createElement('button');
    prev.type = 'button';
    prev.setAttribute('aria-label', 'Poprzednie opinie');
    prev.textContent = '‹';

    const dots = document.createElement('div');
    dots.className = 'polyglot-review-dots';

    const count = document.createElement('span');
    count.className = 'polyglot-review-count';
    count.setAttribute('aria-live', 'polite');

    const next = document.createElement('button');
    next.type = 'button';
    next.setAttribute('aria-label', 'Następne opinie');
    next.textContent = '›';

    controls.append(prev, dots, count, next);

    originalGrid.insertAdjacentElement('afterend', grid);
    grid.insertAdjacentElement('afterend', controls);

    section.classList.add('polyglot-ready');

    let page = 0;

    function perPage() {
      if (window.innerWidth <= 780) return 1;
      if (window.innerWidth <= 1180) return 2;
      return 3;
    }

    function render() {
      const cards = Array.from(grid.children);
      const per = perPage();
      const totalPages = Math.max(1, Math.ceil(cards.length / per));

      if (page >= totalPages) page = totalPages - 1;
      if (page < 0) page = 0;

      cards.forEach((card, i) => {
        const visible = i >= page * per && i < (page + 1) * per;
        card.classList.toggle('is-visible', visible);
      });

      dots.innerHTML = '';
      for (let i = 0; i < totalPages; i++) {
        const dot = document.createElement('span');
        if (i === page) dot.classList.add('is-active');
        dots.appendChild(dot);
      }

      count.textContent = `${page + 1} / ${totalPages}`;
    }

    function showCurrentPage() {
      render();
      if (window.innerWidth <= 780) {
        grid.scrollIntoView({ block: 'start', behavior: 'smooth' });
      }
    }

    prev.addEventListener('click', () => {
      const total = Math.ceil(grid.children.length / perPage());
      page = (page - 1 + total) % total;
      showCurrentPage();
    });

    next.addEventListener('click', () => {
      const total = Math.ceil(grid.children.length / perPage());
      page = (page + 1) % total;
      showCurrentPage();
    });

    let lastPer = perPage();
    window.addEventListener('resize', () => {
      const now = perPage();
      if (now !== lastPer) {
        lastPer = now;
        page = 0;
        render();
      }
    });

    render();
    return true;
  }

  let attempts = 0;
  const timer = setInterval(async () => {
    attempts++;
    const ok = await buildReviews();
    if (ok || attempts > 100) clearInterval(timer);
  }, 120);
})();
</script>

    }

    if (!nav.querySelector('a[href="#jak-zaczac"]')) {
      var link = document.createElement('a');
      link.href = '#jak-zaczac';
      link.textContent = 'Jak zacząć?';
      var faqLink = nav.querySelector('a[href="#faq"]');
      if (faqLink) nav.insertBefore(link, faqLink);
    }
    var studioLink = nav.querySelector('a[href="#studio"]');
    if (studioLink) studioLink.textContent = 'Studio';

    var order = ['#oferta', '#o-mnie', '#opinie', '#jak-zaczac', '#faq', '#studio', '#newsletter', '#kontakt'];
    order.forEach(function (href) {
      var item = nav.querySelector('a[href="' + href + '"]');
      if (item) nav.appendChild(item);
    });
    return true;
  }

  var attempts = 0;
  var timer = setInterval(function () {
    attempts += 1;
    if (applyConsultationUpdate() || attempts > 100) clearInterval(timer);
  }, 60);
})();
</script>
