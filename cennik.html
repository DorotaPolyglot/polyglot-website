  <body>
    <div id="root"></div>

    <script>
      window.addEventListener('message', function (event) {
        if (!event.data || event.data.type !== 'polyglot-form-height') return;
        var frames = document.querySelectorAll('iframe.polyglot-form-frame');
        frames.forEach(function (frame) {
          if (frame.contentWindow === event.source && event.data.height) {
            frame.style.height = Math.max(220, Number(event.data.height)) + 'px';
          }
        });
      });
    </script>

    <script>
      (function () {
        var attempts = 0;

        function updatePricing() {
          var options = document.querySelector('.pricing-options');
          if (!options) return false;

          var sourceCard = options.querySelector('.pricing-card-featured') || options.querySelector('.pricing-card');
          if (!sourceCard) return false;

          function createCard(data) {
            var card = sourceCard.cloneNode(true);
            card.className = data.featured ? 'pricing-card pricing-card-featured' : 'pricing-card';
            var badge = card.querySelector('.pricing-badge');

            if (data.featured) {
              if (!badge) {
                badge = document.createElement('span');
                badge.className = 'pricing-badge';
                card.insertBefore(badge, card.firstChild);
              }
              badge.textContent = 'NAJCZĘŚCIEJ WYBIERANA';
            } else if (badge) {
              badge.remove();
            }

            card.querySelector('.pricing-label').textContent = data.label;
            card.querySelector('h2').textContent = data.duration;

            var price = card.querySelector('.pricing-value');
            price.innerHTML = '';
            price.appendChild(document.createTextNode(data.price));
            var suffix = document.createElement('small');
            suffix.textContent = data.suffix;
            price.appendChild(suffix);

            card.querySelector('.pricing-card > p:not(.pricing-label)').textContent = data.description;
            var buttonText = card.querySelector('.button span');
            if (buttonText) buttonText.textContent = data.button;
            return card;
          }

          var cards = [
            {
              label: 'Zajęcia indywidualne', duration: '55 min', price: '130 zł', suffix: ' / spotkanie',
              description: 'Indywidualne zajęcia online dopasowane do Twojego poziomu, potrzeb i celów. Pracujemy w Twoim tempie, koncentrując się na praktycznym wykorzystaniu języka i swobodnej komunikacji.',
              button: 'ZAPYTAJ O WOLNY TERMIN', featured: true
            },
            {
              label: 'Zajęcia w parze', duration: '55 min', price: '80 zł', suffix: ' / osoba / spotkanie',
              description: 'Zajęcia online dla dwóch osób na podobnym poziomie zaawansowania. Dużo praktycznej komunikacji, wspólnej pracy i możliwość nauki z wybraną przez siebie osobą.',
              button: 'ZAPYTAJ O ZAJĘCIA W PARZE', featured: false
            }
          ];

          options.innerHTML = '';
          cards.forEach(function (data) { options.appendChild(createCard(data)); });

          var additional = document.querySelector('.pricing-additional');
          if (additional) additional.remove();

          var note = document.querySelector('.pricing-note');
          if (note) {
            var noteCopy = note.querySelector('div');
            if (noteCopy) {
              noteCopy.innerHTML =
                '<p class="eyebrow">PIERWSZE SPOTKANIE</p>' +
                '<h2>60 zł / 30 min</h2>' +
                '<p>Pierwsze spotkanie ma formę krótkiej konsultacji. Poznamy Twój poziom, potrzeby i cele, porozmawiamy o sposobie prowadzenia zajęć oraz dobierzemy odpowiednie materiały i plan nauki.</p>';
            }
            var noteButton = note.querySelector('.button span');
            if (noteButton) noteButton.textContent = 'UMÓW PIERWSZE SPOTKANIE';
          }

          if (!document.querySelector('.pricing-terms')) {
            var terms = document.createElement('p');
            terms.className = 'pricing-terms';
            terms.textContent = 'W przypadku kursów realizowanych w ramach indywidualnie ustalonych pakietów lub finansowanych przez firmy warunki mogą być ustalane odrębnie.';
            if (note) note.insertAdjacentElement('afterend', terms);
          }

          if (!document.querySelector('#pricing-update-styles')) {
            var style = document.createElement('style');
            style.id = 'pricing-update-styles';
            style.textContent = '.pricing-terms{max-width:820px;margin:18px auto 0;color:#786c69;font-size:10.5px;font-style:italic;line-height:1.7;text-align:center}';
            document.head.appendChild(style);
          }

          return true;
        }

        var timer = setInterval(function () {
          attempts += 1;
          if (updatePricing() || attempts > 100) clearInterval(timer);
        }, 50);
      })();
    </script>
